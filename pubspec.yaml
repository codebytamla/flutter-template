name: flutter_firebase_template
description: "A Flutter template with Firebase Authentication and Riverpod state management."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Riverpod (without code generation for now)
  flutter_riverpod: ^2.6.1

  # Firebase (Latest versions as of Nov 2024)
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  google_sign_in: ^6.3.0

  # Environment variables
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
